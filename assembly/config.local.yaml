kafka:
  ship_assembled_producer:
    topic_name: "assembly.ship-assembled"
  order_paid_consumer:
    topic_name: "order.paid"
    group_id: "1"

otel:
  collector_endpoint: "localhost:4317"
  service_name: "assembly-service"
  environment: "development"
  service_version: "1.0.0"
  sampling_ratio: 1.0
  enable_otlp: true

logger:
  level: "info"   # debug | info | warn | error
