grpc:
  host: "localhost"
  port: "50053"
  keepalive:
    timeMinutes: 5 # Интервал ping'ов для обнаружения мёртвого сервера
    timeoutSec: 1 # Таймаут ожидания pong
    maxConnIdleMinutes: 15 # Закрыть idle-соединения (нет активных RPC)
    maxConnAgeMinutes: 30 # Принудительная ротация для балансировки
    maxConnAgeGraceSec: 5  # Время на завершение активных RPC
    minPingIntervalMinutes: 5  # Минимальный интервал ping'ов от клиента (защита от DoS)
    shutdownTimeoutSec: 5

pg:
  host: "localhost"
  port: "5434"
  database: "iam-service"
  user: "iam-service-user"
  password: "iam-service-password"
  sslmode: "disable"

redis:
  host: "localhost"
  port: "6379"
  password: ""
  db: 0
  connection_timeout: 5 # seconds

session:
  ttl: 24 # hours

otel:
  endpoint: "localhost:4317"
  service_name: "iam-service"
  environment: "development"
  service_version: "1.0.0"
  service_ration: 1.0
  otlp: true

logger:
  level: "info"   # debug | info | warn | error
