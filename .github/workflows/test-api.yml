name: "Test API"

on:
  workflow_call:

jobs:
  test-api:
    name: "API tests"
    runs-on: ubuntu-24.04

    # Запускаем Kafka в качестве фонового контейнера
    services:
      kafka:
        image: ubuntu/kafka:3.7-24.04_beta # Быстрый и легкий KRaft-ready образ
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: 'broker,controller'
          KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_EXTERNAL://0.0.0.0:9092,CONTROLLER://kafka:29093
          # Это сопоставляет брокер с localhost, чтобы приложение на хосте могло с ним связаться
          KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_EXTERNAL://localhost:9092,CONTROLLER://kafka:29093'
          KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
          # Для обеспечения временного и быстрого выполнения операций в оперативной памяти,
          # храним логи в каталоге /tmp
          KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs' 

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version: '1.26.3'
          cache-dependency-path: '**/go.sum'

      - name: Cache task-installed binaries
        uses: actions/cache@v5.0.5
        with:
          path: bin
          key: ${{ runner.os }}-task-bin-${{ hashFiles('Taskfile.yaml') }}
          restore-keys: |
            ${{ runner.os }}-task-bin-

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@v3.50.0

      - name: Run API tests
        run: task test:api
        env:
          # Inject the connection string into your Go tests if needed
          KAFKA_BROKERS: "localhost:9092" 
