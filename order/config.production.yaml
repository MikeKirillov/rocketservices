grpc:
  inventory_client:
    address: "0.0.0.0:50051"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  payment_client:
    address: "0.0.0.0:50052"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  iam_client:
    address: "0.0.0.0:50053"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong

pg:
  host: "postgres-production"
  port: "5432"
  database: "order-service"
  user: "MUST_BE_SET_VIA_ENV"
  password: "MUST_BE_SET_VIA_ENV"
  sslmode: "require"

http:
  host: "0.0.0.0"
  port: "8080"
  timeout:
    readHeaderSec: 5
    readSec: 15
    writeSec: 15
    idleSec: 60
    shutdownSec: 10
    middlwareSec: 10

kafka:
  order_paid_producer:
    topic_name: "order.paid"
  ship_assembled_consumer:
    topic_name: "assembly.ship-assembled"
    group_id: "1"

otel:
  collector_endpoint: "0.0.0.0:4317"
  service_name: "order-service"
  environment: "development"
  service_version: "1.0.0"
  sampling_ratio: 1.0
  enable_otlp: true

logger:
  level: "warn"   # debug | info | warn | error

rate_limit:
  redis_address: "0.0.0.0:6379"
  rate: 100
  burst: 200
