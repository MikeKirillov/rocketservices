grpc:
  inventory:
    host: "localhost"
    port: "50051"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  payment:
    host: "localhost"
    port: "50052"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  auth:
    host: "localhost"
    port: "50053"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong

pg:
  host: "localhost"
  port: "5432"
  database: "order-service"
  user: "order-service-user"
  password: "order-service-password"
  sslmode: "disable"

http:
  host: "localhost"
  port: "8080"
  timeout:
    readHeaderSec: 5
    readSec: 15
    writeSec: 15
    idleSec: 60
    shutdownSec: 10
    middlwareSec: 10

kafka:
  producer:
    topic: "order.paid"
  consumer:
    topic: "assembly.ship-assembled"
    group: 1

otel:
  endpoint: "localhost:4317"
  service_name: "order-service"
  environment: "development"
  service_version: "1.0.0"
  service_ration: 1.0
  otlp: true

logger:
  level: "info"   # debug | info | warn | error
