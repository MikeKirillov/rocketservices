grpc:
  inventory_client:
    address: "localhost:50051"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  payment_client:
    address: "localhost:50052"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong
  iam_client:
    address: "localhost:50053"
    keepalive:
      timeMin: 5 # Интервал ping'ов для обнаружения мёртвого сервера
      timeoutSec: 1 # Таймаут ожидания pong

pg:
  host: "localhost"
  port: "5432"
  database: "order-service"
  user: "order-service-user"
  password: "order-service-password"
  sslmode: "disable"

http:
  host: "localhost"
  port: "8080"
  timeout:
    readHeaderSec: 5
    readSec: 15
    writeSec: 15
    idleSec: 60
    shutdownSec: 10
    middlwareSec: 10

kafka:
  order_paid_producer:
    topic_name: "order.paid"
  ship_assembled_consumer:
    topic_name: "assembly.ship-assembled"
    group_id: "1"

otel:
  collector_endpoint: "localhost:4317"
  service_name: "order-service"
  environment: "development"
  service_version: "1.0.0"
  sampling_ratio: 1.0
  enable_otlp: true

logger:
  level: "info"   # debug | info | warn | error

rate_limit:
  redis_address: "localhost:6379"
  rate: 100
  burst: 200
